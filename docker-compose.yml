version: '3.8'

services:
  rabbitmq:
    image: "rabbitmq:management"
    container_name: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  product:
    build:
      context: ./services/product-services
    container_name: product-services
    ports:
      - "8080:8080"
    networks:
      - backend
    environment:
      - HTTP_LISTEN_PORT=8080
      - SQLITE_DB_PATH=/app/database/product_services.db
    volumes:
      - ./services/product-services/database:/app/database
    depends_on:
      rabbitmq:
        condition: service_healthy

  order:
    build:
      context: ./services/order-services
    container_name: order-services
    environment:
      - HTTP_LISTEN_PORT=8082
      - SQLITE_DB_PATH=/app/database/order_services.db
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    ports:
      - "8082:8082"
    networks:
      - backend
    volumes:
      - ./services/order-services/database:/app/database
    depends_on:
      rabbitmq:
        condition: service_healthy

  inventory:
    build:
      context: ./services/inventory-services
    container_name: inventory-services
    environment:
      - HTTP_LISTEN_PORT=8081
      - SQLITE_DB_PATH=/app/database/inventory_services.db
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    ports:
      - "8081:8081"
    networks:
      - backend
    volumes:
      - ./services/inventory-services/database:/app/database
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  backend:
    driver: bridge